name: Test and Release

permissions:
  contents: write
  issues: write
  id-token: write

on:
  push:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - ">=24.22.1 <25"
          - ">=26.12.1 <27"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Compile TypeScript
        run: npx tsc

      - name: Check source code with eslint
        run: npx eslint ./

      - name: Check if source code is properly formatted
        run: npx prettier -c ./

      - run: npm test

  test:
    runs-on: ubuntu-latest

    needs: [test-matrix]

    # Stable required status check for the repository rules, independent of
    # the Node.js versions in the matrix.
    if: ${{ always() }}

    steps:
      - name: All tests must have succeeded
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: test "$RESULT" = "success"

  release:
    runs-on: ubuntu-latest

    needs: [test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.12.1 <27"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Semantic release
        run: npx semantic-release
