name: CDK bootstrap

permissions:
  id-token: write

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region"
        default: ""
        required: false

env:
  CI: 1
  FORCE_COLOR: 3
  JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: 1
  NODE_NO_WARNINGS: 1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION_CI }}

jobs:
  bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Override AWS Region
        if: ${{ github.event.inputs.aws_region != '' }}
        run:
          echo "AWS_REGION=${{ github.event.inputs.aws_region }}" >> $GITHUB_ENV

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      # This will only work, if you've run `npx cdk deploy` once manually.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # The role is set up via https://github.com/bifravst/ci
          # secrets.AWS_ACCOUNT_ID_CI is an organization secret
          role-to-assume: |
            arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_CI }}:role/${{ github.repository_owner }}-ci-${{ github.event.repository.name }}
          # vars.AWS_REGION_CI is an organization variable
          aws-region: ${{ env.AWS_REGION }}

      - run: npx cdk bootstrap
